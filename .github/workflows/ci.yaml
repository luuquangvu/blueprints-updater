name: CI

on:
  push: &ci_trigger
    branches:
      - main
    paths:
      - "**.py"
      - "**.json"
      - "**.yaml"
      - "**.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request: *ci_trigger
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    name: "Static Checks (Synced with Local Environment)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff
        run: uv run ruff check

      - name: Run Ruff Format
        run: uv run ruff format --check

      - name: Run Ty Check
        run: uv run ty check

      - name: Run Pyright
        run: uv run pyright

      - name: Run Interrogate
        run: uv run interrogate

      - name: Run Taplo
        run: uv run taplo format --check .

      - name: Run Pytest
        run: uv run pytest

  setup-matrix:
    runs-on: ubuntu-latest
    name: "Setup Compatibility Matrix"
    outputs:
      absolute_latest_ha: ${{ steps.set-matrix.outputs.absolute_latest_ha }}
      matched_latest_ha: ${{ steps.set-matrix.outputs.matched_latest_ha }}
      matched_latest_harness: ${{ steps.set-matrix.outputs.matched_latest_harness }}
      test_dependency_metadata: ${{ steps.set-matrix.outputs.test_dependency_metadata }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          LATEST_PAIR_JSON=$(uv run --no-project --with orjson --with packaging \
            python tools/validate_compatibility.py --resolve-latest-json)
          MATCHED_LATEST_HA=$(jq -r .ha_ver <<< "$LATEST_PAIR_JSON")
          MATCHED_LATEST_HARNESS=$(jq -r .harness_ver <<< "$LATEST_PAIR_JSON")
          ABSOLUTE_LATEST_HA=$(jq -r .absolute_latest_ha_ver <<< "$LATEST_PAIR_JSON")
          TEST_DEPENDENCY_METADATA_JSON=$(uv run --no-project --with orjson --with packaging \
            python tools/validate_compatibility.py --required-test-dependency-metadata-json)

          if [[ "$MATCHED_LATEST_HA" = "null" || "$MATCHED_LATEST_HARNESS" = "null" || "$ABSOLUTE_LATEST_HA" = "null" ]]; then
            echo "::error::Failed to resolve latest matched Home Assistant/test harness pair"
            exit 1
          fi

          for version in "$MATCHED_LATEST_HA" "$MATCHED_LATEST_HARNESS" "$ABSOLUTE_LATEST_HA"; do
            if [[ ! "$version" =~ ^[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*$ ]]; then
              echo "::error::Invalid compatibility version format: $version"
              exit 1
            fi
          done

          jq -e '
            . as $metadata |
            (type == "object") and
            ($metadata.required_packages | type == "array" and
              (if length == 0 then true else (length == (unique | length) and all(.[]; type == "string" and test("^[a-zA-Z0-9._\\[\\]-]+$"))) end)) and
            ($metadata.homeassistant_constraint_packages | type == "array" and
              (if length == 0 then true else (length == (unique | length) and all(.[]; type == "string" and test("^[a-zA-Z0-9._\\[\\]-]+$"))) end)) and
            ($metadata.test_harness_package | type == "string" and test("^[a-zA-Z0-9._\\[\\]-]+$")) and
            (($metadata.required_packages | index($metadata.test_harness_package)) != null) and
            (($metadata.homeassistant_constraint_packages | length) == 0 or all(
              $metadata.homeassistant_constraint_packages[];
              . as $package |
              ($metadata.required_packages | index($package)) != null
            ))
          ' <<< "$TEST_DEPENDENCY_METADATA_JSON" >/dev/null

          jq -e '
            (type == "array") and all(.[]; (
              (type == "object") and
              (.ha_version | type == "string") and
              (.harness_version | type == "string") and
              (.python_version | type == "string") and
              (.ha_version == "latest" or (.ha_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$")))
              and (.harness_version == "latest" or (.harness_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$")))
              and ((.ha_version == "latest") == (.harness_version == "latest"))
              and (.python_version | test("^[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*$"))
            ))
          ' tools/compatibility_matrix.json >/dev/null

          uv run --no-project --with orjson --with packaging \
            python tools/validate_compatibility.py --validate-matrix

          MATRIX_JSON=$(jq -c \
            --arg latest_ha "$MATCHED_LATEST_HA" \
            --arg latest_harness "$MATCHED_LATEST_HARNESS" '
            map(
              (if .ha_version == "latest" then
                . + {
                  ha_version: ("latest matched (" + $latest_ha + ")"),
                  ha_real_version: $latest_ha,
                  harness_real_version: $latest_harness
                }
              else
                . + {
                  ha_real_version: .ha_version,
                  harness_real_version: .harness_version
                }
              end
            )
            )
            | {include: .}
          ' tools/compatibility_matrix.json)
          echo "absolute_latest_ha=$ABSOLUTE_LATEST_HA" >> "$GITHUB_OUTPUT"
          echo "matched_latest_ha=$MATCHED_LATEST_HA" >> "$GITHUB_OUTPUT"
          echo "matched_latest_harness=$MATCHED_LATEST_HARNESS" >> "$GITHUB_OUTPUT"
          echo "test_dependency_metadata=$TEST_DEPENDENCY_METADATA_JSON" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  latest-harness-canary:
    needs: setup-matrix
    runs-on: ubuntu-latest
    name: "Latest HA/Harness Alignment Canary"
    steps:
      - name: Report harness publication lag
        env:
          ABSOLUTE_LATEST_HA: ${{ needs.setup-matrix.outputs.absolute_latest_ha }}
          MATCHED_LATEST_HA: ${{ needs.setup-matrix.outputs.matched_latest_ha }}
          MATCHED_LATEST_HARNESS: ${{ needs.setup-matrix.outputs.matched_latest_harness }}
        run: |
          if [[ "$ABSOLUTE_LATEST_HA" == "$MATCHED_LATEST_HA" ]]; then
            echo "Latest Home Assistant $ABSOLUTE_LATEST_HA is matched by harness $MATCHED_LATEST_HARNESS"
            exit 0
          fi
          echo "::warning title=Home Assistant harness lag::Newest HA $ABSOLUTE_LATEST_HA is unmatched; compatibility gates use HA $MATCHED_LATEST_HA with harness $MATCHED_LATEST_HARNESS"

  compatibility:
    needs: setup-matrix
    runs-on: ubuntu-latest
    name: ${{ matrix.ha_version && format('Compatibility ({0}, harness {1}, Python {2})', matrix.ha_version, matrix.harness_real_version, matrix.python_version) || 'Compatibility' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        shell: bash
        env:
          MATRIX_HA_REAL_VERSION: ${{ matrix.ha_real_version }}
          MATRIX_HARNESS_REAL_VERSION: ${{ matrix.harness_real_version }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python_version }}
          TEST_DEPENDENCY_METADATA_JSON: ${{ needs.setup-matrix.outputs.test_dependency_metadata }}
        run: |
          set -euo pipefail

          uv --no-config venv --no-project --python "$MATRIX_PYTHON_VERSION"
          HA_SPEC="homeassistant==$MATRIX_HA_REAL_VERSION"
          jq -e '
            type == "object" and
            (.test_harness_package | type == "string") and
            (.required_packages | type == "array") and
            (.homeassistant_constraint_packages | type == "array")
          ' <<< "$TEST_DEPENDENCY_METADATA_JSON" >/dev/null

          mapfile -t REQUIRED_TEST_PACKAGES < <(
            jq -r '.required_packages[]?' <<< "$TEST_DEPENDENCY_METADATA_JSON"
          )
          mapfile -t HA_CONSTRAINED_TEST_PACKAGES < <(
            jq -r '.homeassistant_constraint_packages[]?' <<< "$TEST_DEPENDENCY_METADATA_JSON"
          )
          TEST_HARNESS_PACKAGE=$(
            jq -e -r '.test_harness_package' <<< "$TEST_DEPENDENCY_METADATA_JSON"
          )

          declare -A HA_CONSTRAINT_SPECS=()
          HAS_CONSTRAINTS=0
          for package in "${HA_CONSTRAINED_TEST_PACKAGES[@]-}"; do
            if [[ -n "$package" ]]; then
              HAS_CONSTRAINTS=1
              break
            fi
          done

          if [[ "$HAS_CONSTRAINTS" -eq 1 ]]; then
            HA_CONSTRAINTS_CDN_URL="https://cdn.jsdelivr.net/gh/home-assistant/core@$MATRIX_HA_REAL_VERSION/homeassistant/package_constraints.txt"
            HA_CONSTRAINTS_GITHUB_URL="https://raw.githubusercontent.com/home-assistant/core/$MATRIX_HA_REAL_VERSION/homeassistant/package_constraints.txt"
            fetch_constraints() {
              curl -sS -f --max-time 20 --retry 3 "$HA_CONSTRAINTS_CDN_URL" 2>/dev/null \
                || curl -sS -f --max-time 20 --retry 3 "$HA_CONSTRAINTS_GITHUB_URL"
            }
            HA_CONSTRAINTS=$(fetch_constraints)
            if [[ -z "${HA_CONSTRAINTS//[[:space:]]/}" ]]; then
              echo "::error::Fetched empty package_constraints.txt for Home Assistant $MATRIX_HA_REAL_VERSION"
              exit 1
            fi

            for package in "${HA_CONSTRAINED_TEST_PACKAGES[@]}"; do
              if [[ -z "$package" ]]; then
                continue
              fi
              if ! package_spec=$(uv run --no-project --with orjson --with packaging \
                python tools/validate_compatibility.py --parse-constraint-spec "$package" <<< "$HA_CONSTRAINTS"); then
                echo "::error::Failed to resolve $package from package_constraints.txt (tried CDN and GitHub)"
                exit 1
              fi
              HA_CONSTRAINT_SPECS["$package"]="$package_spec"
            done
          fi

          REQUIRED_TEST_DEPS=()
          for package in "${REQUIRED_TEST_PACKAGES[@]}"; do
            if [[ "$package" == "$TEST_HARNESS_PACKAGE" ]]; then
              REQUIRED_TEST_DEPS+=("$package==$MATRIX_HARNESS_REAL_VERSION")
            elif [[ -n "${HA_CONSTRAINT_SPECS[$package]-}" ]]; then
              REQUIRED_TEST_DEPS+=("${HA_CONSTRAINT_SPECS[$package]}")
            else
              REQUIRED_TEST_DEPS+=("$package")
            fi
          done
          AIODNS_SPEC="${HA_CONSTRAINT_SPECS[aiodns]-}"
          if [[ "$AIODNS_SPEC" != aiodns==?* ]]; then
            echo "::error::Invalid resolved aiodns constraint: $AIODNS_SPEC"
            exit 1
          fi
          AIODNS_VERSION="${AIODNS_SPEC#aiodns==}"
          TRANSITIVE_COMPATIBILITY_SPECS_JSON=$(uv run --no-project --with orjson --with packaging \
            python tools/validate_compatibility.py --transitive-compatibility-specs-json \
            --aiodns-version "$AIODNS_VERSION")
          if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' \
            <<< "$TRANSITIVE_COMPATIBILITY_SPECS_JSON" >/dev/null; then
            echo "::error::Invalid transitive compatibility specs"
            exit 1
          fi
          mapfile -t TRANSITIVE_COMPATIBILITY_SPECS < <(
            jq -r '.[]' <<< "$TRANSITIVE_COMPATIBILITY_SPECS_JSON"
          )
          uv --no-config pip install --prerelease allow --python .venv/bin/python \
            "$HA_SPEC" "${REQUIRED_TEST_DEPS[@]}" "${TRANSITIVE_COMPATIBILITY_SPECS[@]}"

      - name: Verify Home Assistant/test harness pair
        env:
          MATRIX_HA_REAL_VERSION: ${{ matrix.ha_real_version }}
          MATRIX_HARNESS_REAL_VERSION: ${{ matrix.harness_real_version }}
        run: >-
          uv run --no-project --with orjson --with packaging
          python tools/validate_compatibility.py
          --verify-pair-python .venv/bin/python
          --expected-ha "$MATRIX_HA_REAL_VERSION"
          --expected-harness "$MATRIX_HARNESS_REAL_VERSION"

      - name: Run Pytest
        run: uv run --no-project --python .venv/bin/python pytest --no-cov
